openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: accidents
    description: Accident register and reporting
  - name: dashboard
    description: Accident trend summaries
  - name: actions
    description: Improvement action tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /accidents:
    get:
      operationId: listAccidents
      tags: [accidents]
      summary: List and filter accident records
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: room
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: accidentType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching accident records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accident"
    post:
      operationId: createAccident
      tags: [accidents]
      summary: Record an accident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccidentInput"
      responses:
        "201":
          description: Accident recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accident"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard totals and accident breakdowns
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List improvement actions
      responses:
        "200":
          description: Improvement actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Action"
    post:
      operationId: createAction
      tags: [actions]
      summary: Create an improvement action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionInput"
      responses:
        "201":
          description: Action created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
  /actions/{id}:
    patch:
      operationId: updateAction
      tags: [actions]
      summary: Update action details or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionUpdate"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Accident:
      type: object
      required: [id, date, time, childName, room, location, accidentType, injuryType, description, treatmentGiven, parentInformed, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        time: { type: string }
        childName: { type: string }
        room: { type: string }
        location: { type: string }
        accidentType: { type: string }
        injuryType: { type: string }
        description: { type: string }
        treatmentGiven: { type: string }
        parentInformed: { type: boolean }
        createdAt: { type: string, format: date-time }
    AccidentInput:
      type: object
      required: [date, time, childName, room, location, accidentType, injuryType, description, treatmentGiven, parentInformed]
      properties:
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$" }
        childName: { type: string, minLength: 1, maxLength: 120 }
        room: { type: string, minLength: 1, maxLength: 80 }
        location: { type: string, minLength: 1, maxLength: 120 }
        accidentType: { type: string, minLength: 1, maxLength: 80 }
        injuryType: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        treatmentGiven: { type: string, minLength: 1, maxLength: 5000 }
        parentInformed: { type: boolean }
    DashboardBreakdown:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    DashboardSummary:
      type: object
      required: [totalThisMonth, byRoom, byLocation, byType, recentAccidents]
      properties:
        totalThisMonth: { type: integer }
        byRoom:
          type: array
          items: { $ref: "#/components/schemas/DashboardBreakdown" }
        byLocation:
          type: array
          items: { $ref: "#/components/schemas/DashboardBreakdown" }
        byType:
          type: array
          items: { $ref: "#/components/schemas/DashboardBreakdown" }
        recentAccidents:
          type: array
          items: { $ref: "#/components/schemas/Accident" }
    Action:
      type: object
      required: [id, title, reason, assignedTo, dueDate, status, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        reason: { type: string }
        assignedTo: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: ["Not Started", "In Progress", "Completed"] }
        createdAt: { type: string, format: date-time }
    ActionInput:
      type: object
      required: [title, reason, assignedTo, dueDate, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 5000 }
        assignedTo: { type: string, minLength: 1, maxLength: 120 }
        dueDate: { type: string, format: date }
        status: { type: string, enum: ["Not Started", "In Progress", "Completed"] }
    ActionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 5000 }
        assignedTo: { type: string, minLength: 1, maxLength: 120 }
        dueDate: { type: string, format: date }
        status: { type: string, enum: ["Not Started", "In Progress", "Completed"] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

